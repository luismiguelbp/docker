# Mosquitto MQTT Broker Configuration
# Documentation: https://mosquitto.org/man/mosquitto-conf-5.html

# =================================================================
# Persistence
# =================================================================

persistence true
persistence_location /mosquitto/data/

# =================================================================
# Logging
# =================================================================

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z

# =================================================================
# Listeners
# =================================================================

# MQTT Default listener
listener 1883 0.0.0.0
socket_domain ipv4
max_connections 500

# MQTT over TLS
#listener 8883 0.0.0.0
#cafile /mosquitto/ca_certificates/ca.crt
#certfile /mosquitto/ca_certificates/mosquitto.crt
#keyfile /mosquitto/ca_certificates/mosquitto.key

# MQTT over WebSockets
listener 9001 0.0.0.0
protocol websockets

# MQTT over WebSockets with TLS
#listener 9001 0.0.0.0
#protocol websockets
#cafile /mosquitto/ca_certificates/ca.crt
#certfile /mosquitto/ca_certificates/mosquitto.crt
#keyfile /mosquitto/ca_certificates/mosquitto.key

# =================================================================
# Security
# =================================================================

# Mosquitto >= 2.0 only allows user/password authenticated connections.
# Set to true for testing without authentication.
allow_anonymous true
