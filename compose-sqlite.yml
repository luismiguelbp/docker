# SQLite Database Helper
# Add to COMPOSE_FILE in .env: compose.yml,compose-sqlite.yml
#
# SQLite is an embedded database that doesn't need a server.
# This service provides a web-based interface to manage SQLite databases.
#
# Access: http://localhost:8080
# Database files are stored in: ${DOCKER_PATH}/data/sqlite/

services:
  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: ${COMPOSE_PROJECT_NAME}_sqlite-web
    hostname: sqlite-web
    ports:
      - "8080:8080"
    volumes:
      - ${DOCKER_PATH}/data/sqlite:/data:rw
    environment:
      - TZ=${DOCKER_TZ}
      - SQLITE_DATABASE=/data/database.db
    networks:
      - docker-bridge
    restart: unless-stopped
    command: sqlite_web -H 0.0.0.0 -p 8080 /data/database.db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
